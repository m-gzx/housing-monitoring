name: Housing monitor

on:
  schedule:
    # 12h00 UTC ≈ 7-8h heure de l'Est (selon heure d'été/hiver).
    - cron: "0 12 * * *"
  workflow_dispatch: {}

permissions:
  contents: write
  pages: write
  id-token: write

# Évite deux déploiements Pages concurrents si un run manuel chevauche le cron.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install -r requirements.txt

      # Nécessaire pour Centris (protégé par Cloudflare) ; uBee n'en a pas besoin.
      - run: playwright install --with-deps chromium

      - run: python monitor.py

      - name: Committe l'historique roulant mis à jour
        run: |
          git config user.name "housing-monitoring-bot"
          git config user.email "actions@users.noreply.github.com"
          git add history.json
          git diff --cached --quiet || git commit -m "Mise à jour de l'historique roulant"
          # Un run peut prendre 15-20 min (scraping Centris) ; si main a
          # avancé entre-temps (ex. une PR mergée pendant le run), le push
          # est rejeté (non-fast-forward). On rebase et on réessaie plutôt
          # que d'échouer tout le run et de sauter le déploiement Pages.
          for i in 1 2 3 4 5; do
            git push && break
            echo "Push rejeté (main a probablement avancé pendant le run) — tentative $i/5 après rebase"
            git pull --rebase origin main
            sleep $((i * 5))
          done

      - name: Prépare le rapport pour GitHub Pages
        run: |
          mkdir -p _site
          cp report.html _site/index.html

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Déploie sur GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
